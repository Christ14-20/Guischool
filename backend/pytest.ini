[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests/test_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --cov-report=html:htmlcov
    --cov-report=term-missing
markers =
    unit: Tests unitaires (sans DB)
    integration: Tests d'intégration (avec DB)
    tenant_isolation: Tests vérifiant l'isolation multi-tenant (obligatoires pour chaque modèle TenantScopedModel)
