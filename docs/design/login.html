<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eduguinée 3.0 — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0B0F19;
      --bg-card: rgba(21, 27, 43, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-placeholder: #475569;
      --accent-violet: #6366f1;
      --accent-violet-dark: #4f46e5;
      --accent-gold: #F59E0B;
      --accent-green: #10B981;
      --danger: #EF4444;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .bg-orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      top: -120px; right: -80px;
      animation: float1 10s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(245,158,11,0.08) 0%, transparent 70%);
      bottom: -80px; left: -60px;
      animation: float2 12s ease-in-out infinite reverse;
    }
    .bg-orb-3 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: float3 15s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, 20px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(25px, -15px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.15); }
    }

    /* Mesh grid overlay */
    .mesh-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      position: relative;
      z-index: 10;
      animation: cardEnter 0.6s ease-out;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-violet-dark));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: white;
      font-family: var(--font-display);
      box-shadow: 0 0 32px rgba(99, 102, 241, 0.35);
      animation: logoPulse 3s ease-in-out infinite;
      position: relative;
    }

    .logo::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      animation: logoRing 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 32px rgba(99, 102, 241, 0.35); }
      50% { box-shadow: 0 0 48px rgba(99, 102, 241, 0.55); }
    }
    @keyframes logoRing {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.08); opacity: 0; }
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 15px;
      font-family: var(--font-sans);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: var(--text-placeholder);
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
      background: rgba(255, 255, 255, 0.05);
    }

    .form-input:hover:not(:focus) {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .forgot-link {
      font-size: 13px;
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .forgot-link:hover { color: #a5b4fc; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-violet-dark));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(99, 102, 241, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Shimmer effect on hover */
    .submit-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      transition: left 0.6s ease;
    }
    .submit-btn:hover::after {
      left: 100%;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }
    .divider-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .sso-buttons {
      display: flex;
      gap: 10px;
    }
    .sso-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .sso-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer-text a {
      color: #818cf8;
      text-decoration: none;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 14px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transform: translateX(120%);
      transition: transform 0.4s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.show { transform: translateX(0); }
    .toast-icon { width: 20px; height: 20px; }
    .toast-success .toast-icon { color: var(--accent-green); }
    .toast-error .toast-icon { color: var(--danger); }

    /* Loading state */
    .submit-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }
    .submit-btn.loading::before {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; margin: 16px; }
      .brand-title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="mesh-grid"></div>

  <div class="login-card">
    <div class="logo-container">
      <div class="logo">EG</div>
    </div>
    <h1 class="brand-title">Eduguinée 3.0</h1>
    <p class="brand-subtitle">Portail d'accès unique</p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Adresse email scolaire</label>
        <input type="email" class="form-input" placeholder="nom@ecole.gn" required>
      </div>
      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label">Mot de passe</label>
          <a href="#" class="forgot-link">Mot de passe oublié ?</a>
        </div>
        <input type="password" class="form-input" placeholder="••••••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Se connecter</button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">ou</span>
      <div class="divider-line"></div>
    </div>

    <div class="sso-buttons">
      <button class="sso-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        Par téléphone
      </button>
      <button class="sso-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Code école
      </button>
    </div>

    <p class="footer-text">
      Besoin d'aide ? <a href="#">Contactez le support</a>
    </p>
  </div>

  <div class="toast toast-success" id="toast">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastMsg">Connexion réussie</span>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.classList.add('loading');
      btn.textContent = 'Connexion...';
      setTimeout(() => {
        btn.classList.remove('loading');
        btn.textContent = 'Se connecter';
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = 'Redirection vers le tableau de bord...';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }, 1500);
    });
  </script>
</body>
</html>
